<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Corbin Meier | Software Engineer</title>
    <meta name="description" content="Software Engineer specializing in building sophisticated, high-performance applications." />
    <link rel="canonical" href="https://corbinmeier.net/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Corbin Meier | Software Engineer" />
    <meta property="og:description" content="Software Engineer specializing in building sophisticated, high-performance applications." />
    <meta property="og:url" content="https://corbinmeier.net/" />
    <meta property="og:image" content="https://corbinmeier.net/corbin.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Corbin Meier | Software Engineer" />
    <meta name="twitter:description" content="Software Engineer specializing in building sophisticated, high-performance applications." />
    <meta name="twitter:image" content="https://corbinmeier.net/corbin.jpg" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap" rel="stylesheet" />
    <script>
      (function() {
        var path = window.location.pathname;
        var theme = "blue";
        if (path.startsWith("/projects")) {
          theme = "green";
        } else if (path.startsWith("/about")) {
          theme = "red";
        } else if (path.startsWith("/contact")) {
          theme = "contact";
        }
        document.documentElement.classList.add("theme-" + theme);
      })();
    </script>
    <style>
      html, body {
        background-color: #0a0e17;
      }
      html.theme-green, html.theme-green body {
        background-color: #04100c;
      }
      html.theme-red, html.theme-red body {
        background-color: #100404;
      }
      html.theme-contact, html.theme-contact body {
        background-image: linear-gradient(135deg, #0a0e17 0%, #100404 50%, #04100c 100%) !important;
        background-attachment: fixed !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
